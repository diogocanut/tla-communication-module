\* Scenario: read-only. No node may write, so no INV/VAL traffic ever
\* occurs. nodeState stays "valid" forever, HConsistent is trivially true,
\* PropertyWriteTermination is vacuously true (no node ever enters
\* "write"/"replay").
SPECIFICATION H_Spec

CONSTANTS
    H_NODES       = {1, 2, 3}
    H_WRITERS     = {}
    H_MAX_VERSION = 0
    H_MAX_CRASHES = 0

INVARIANT HTypeOK
INVARIANT HConsistent
PROPERTY PropertyWriteTermination

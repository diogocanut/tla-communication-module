\* Safety-only variant for the scaling grid: same reachable state graph as
\* the full configuration (liveness checking does not change the set of
\* distinct states), used to measure state counts where liveness checking
\* is too expensive. 4 nodes, H_MAX_VERSION = 2.
SPECIFICATION H_Spec

CONSTANTS
    H_NODES       = {1, 2, 3, 4}
    H_WRITERS     = {1, 2, 3, 4}
    H_MAX_VERSION = 2
    H_MAX_CRASHES = 1

INVARIANT HTypeOK
INVARIANT HConsistent
INVARIANT HCrashStop

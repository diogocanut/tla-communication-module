\* Scenario: a single coordinator (node 1) can write, no crashes allowed.
\* Validates the basic write -> INV -> ACKs -> VAL -> commit cycle in
\* isolation, without TS conflicts or failure handling.
SPECIFICATION H_Spec

CONSTANTS
    H_NODES       = {1, 2, 3}
    H_WRITERS     = {1}
    H_MAX_VERSION = 1
    H_MAX_CRASHES = 0

INVARIANT HTypeOK
INVARIANT HConsistent
INVARIANT HCrashStop
PROPERTY PropertyWriteTermination

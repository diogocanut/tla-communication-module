\* Scenario: all nodes may write, no crashes allowed. Exercises Hermes's
\* timestamp-based concurrency resolution: with multiple writers all racing
\* to commit, the (version, tieBreaker) ordering decides which writes
\* preempt which, without any node entering invalid_write via failure
\* paths.
SPECIFICATION H_Spec

CONSTANTS
    H_NODES       = {1, 2, 3}
    H_WRITERS     = {1, 2, 3}
    H_MAX_VERSION = 1
    H_MAX_CRASHES = 0

INVARIANT HTypeOK
INVARIANT HConsistent
PROPERTY PropertyWriteTermination

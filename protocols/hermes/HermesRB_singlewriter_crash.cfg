\* Scenario: a single coordinator (node 1) can write, up to one crash
\* allowed. Exercises the write-replay path: if node 1 crashes mid-write,
\* the followers (which are not in H_WRITERS) must detect the dead
\* coordinator and complete the write themselves via HFollowerWriteReplay.
SPECIFICATION H_Spec

CONSTANTS
    H_NODES       = {1, 2, 3}
    H_WRITERS     = {1}
    H_MAX_VERSION = 1
    H_MAX_CRASHES = 1

INVARIANT HTypeOK
INVARIANT HConsistent
PROPERTY PropertyWriteTermination

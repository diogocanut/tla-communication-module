\* Scenario: all nodes may write, up to one crash allowed. Exercises both
\* concurrent-write resolution and write-replay simultaneously. This is the
\* hardest scenario in the grid and matches the configuration used in the
\* original Hermes spec when crashes are enabled.
SPECIFICATION H_Spec

CONSTANTS
    H_NODES       = {1, 2, 3}
    H_WRITERS     = {1, 2, 3}
    H_MAX_VERSION = 1
    H_MAX_CRASHES = 1

INVARIANT HTypeOK
INVARIANT HConsistent
PROPERTY PropertyWriteTermination

\* Scenario: 3 acceptors, 2 proposers, 2 values, ballots 0..1, up to one crash of an acceptor or a proposer.
\* Proposer 0 owns the even ballots and proposer 1 the odd ones.
SPECIFICATION Spec

CONSTANTS
    a1 = a1  a2 = a2  a3 = a3
    v1 = v1  v2 = v2
    Acceptor   = {a1, a2, a3}
    Proposer   = {0, 1}
    Value      = {v1, v2}
    Quorum     = {{a1, a2}, {a1, a3}, {a2, a3}}
    MaxBallot  = 1
    MaxCrashes = 1
    None       = None
    Ballot <-[Voting] VotingBallot

INVARIANT TypeOK
INVARIANT Inv
INVARIANT InvOneChosen
INVARIANT InvLearned
PROPERTY VotingSpecBar
SYMMETRY Symmetry
